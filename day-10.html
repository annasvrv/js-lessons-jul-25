<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 10</title>
    <link rel="stylesheet" href="css/main.css" />
    <script defer src="js/day-10.js"></script>
  </head>
  <body>
    <div class="container">
      <h1 class="title">Forms and Inputs</h1>
      <h2 class="greeting" id="greet-title">Hello,</h2>
      <form action="" id="user-form" class="form">
        <div class="input-wrapper">
          <label for="name" class="label">Name</label>
          <input type="text" id="name" class="input" />
          <!-- <p id="feedback" class="text">Text</p> -->
        </div>
        <div class="input-wrapper">
          <label for="password" class="label">Password</label>
          <input type="password" id="password" class="input" />
          <p id="alert" class="text"></p>
        </div>
        <button type="submit" class="button">Submit</button>
        <p id="feedback" class="text"></p>
      </form>
      <p class="greeting" id="message"></p>
    </div>
  </body>
</html>
